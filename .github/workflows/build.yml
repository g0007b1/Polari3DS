name: CI

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*'
      - 'LICENSE.txt'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*'
      - 'LICENSE.txt'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pablomk7/luma3dsbuildtools
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Luma3DS workflow used a hardcoded path; forks live under /__w/<owner>/<repo>
    - name: safedir
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
    # Image bundles old libctru.a without QTM symbols (QTMS_*, qtmGetSessionHandle, …).
    # Polari needs a current 3ds-libctru so link matches the QTM API used in Rosalina.
    - name: Upgrade devkitPro packages
      run: dkp-pacman -Syu --noconfirm
    - name: Build
      run: make -j$(nproc --all)
    - uses: actions/upload-artifact@v4
      with:
        name: Polari3DS-nightly
        path: boot.firm
