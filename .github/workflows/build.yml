name: CI

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*'
      - 'LICENSE.txt'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*'
      - 'LICENSE.txt'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Official image: 3ds-dev + libctru baked in at image build (no runtime pacman sync).
    # pablomk7/luma3dsbuildtools is older; dkp-pacman -Syu in CI often gets HTTP 403 from pkg.devkitpro.org.
    container: devkitpro/devkitarm:latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Luma3DS workflow used a hardcoded path; forks live under /__w/<owner>/<repo>
    - name: safedir
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
    # devkitarm image installs 3ds-dev but not general-tools; makerom lives in general-tools.
    # Project_CTR ubuntu zip v0.19+ is built against GLIBC_2.38 (Ubuntu 24); this image is
    # Debian Bookworm (~2.36) — use v0.18.4, or general-tools from devkitPro (same libc as image).
    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM="$DEVKITPRO/devkitARM"
        export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:/usr/local/bin:$PATH"
        if ! command -v makerom >/dev/null 2>&1; then
          echo "Trying devkitPro general-tools (makerom matched to this image libc)..."
          dkp-pacman -S --needed --noconfirm general-tools 2>/dev/null || true
        fi
        if ! command -v makerom >/dev/null 2>&1; then
          echo "Installing makerom v0.18.4 from Project_CTR (v0.19+ ubuntu build needs GLIBC_2.38; image is Bookworm ~2.36)."
          curl -fsSL -o /tmp/makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip"
          unzip -oq /tmp/makerom.zip -d /tmp/makerom-extract
          f="$(find /tmp/makerom-extract -type f -name makerom | head -1)"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "Could not locate makerom binary in zip"; find /tmp/makerom-extract -type f; exit 1
          fi
          install -m755 "$f" /usr/local/bin/makerom
        fi
        command -v makerom
        make -j$(nproc --all)
    - uses: actions/upload-artifact@v4
      with:
        name: Polari3DS-nightly
        path: boot.firm
